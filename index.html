<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pathfinding Lab | IMSciences Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="text-center mb-4">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">🤖 AI-Powered Pathfinding Lab</h1>
        <p class="text-xs text-slate-400">Live Interactive Algorithm Visualizer | IMSciences Demo</p>
    </header>

    <!-- Controls -->
    <div class="flex flex-wrap gap-2 justify-center mb-4 w-full max-w-md">
        <button onclick="randomizeMaze()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded border border-slate-700 transition">🎲 Randomize</button>
        <button onclick="clearWalls()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded border border-slate-700 transition">🧹 Clear Walls</button>
        <button onclick="runRace()" id="runBtn" class="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-4 py-2 rounded shadow-lg transition">🚀 Run Live Race</button>
    </div>

    <!-- Grid Container -->
    <div class="relative bg-slate-900 p-3 rounded-xl border border-slate-800 shadow-2xl">
        <div id="grid" class="grid grid-cols-10 gap-1 select-none"></div>
    </div>

    <!-- Metrics Box -->
    <div class="mt-4 grid grid-cols-2 gap-3 w-full max-w-md text-center">
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg">
            <div class="text-xs text-rose-400 font-medium">🔴 Dijkstra Explored</div>
            <div id="dijkstraNodes" class="text-xl font-bold">--</div>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg">
            <div class="text-xs text-emerald-400 font-medium">🟢 A* AI Explored</div>
            <div id="astarNodes" class="text-xl font-bold">--</div>
        </div>
    </div>

    <!-- Legend -->
    <footer class="mt-4 flex flex-wrap justify-center gap-4 text-xs text-slate-400">
        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-emerald-500 rounded-sm"></span> Start</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-rose-500 rounded-sm"></span> Goal</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-slate-700 rounded-sm"></span> Wall</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-amber-500 rounded-sm"></span> Path</span>
    </footer>

    <script>
        const ROWS = 10, COLS = 10;
        let grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let start = {r: 0, c: 0};
        let goal = {r: 9, c: 9};
        let isDrawing = false;

        // Default obstacles
        grid[3][2] = grid[3][3] = grid[3][4] = grid[3][5] = grid[3][6] = grid[3][7] = 1;
        grid[6][1] = grid[6][2] = grid[6][3] = grid[6][4] = grid[6][5] = grid[6][6] = 1;

        const gridEl = document.getElementById('grid');

        function renderGrid() {
            gridEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = "w-7 h-7 sm:w-8 sm:h-8 rounded transition-all duration-150 flex items-center justify-center text-xs cursor-pointer border border-slate-800";
                    cell.dataset.r = r;
                    cell.dataset.c = c;

                    if (r === start.r && c === start.c) {
                        cell.classList.add('bg-emerald-500');
                        cell.innerText = '🚀';
                    } else if (r === goal.r && c === goal.c) {
                        cell.classList.add('bg-rose-500');
                        cell.innerText = '🎯';
                    } else if (grid[r][c] === 1) {
                        cell.classList.add('bg-slate-700');
                    } else {
                        cell.classList.add('bg-slate-950', 'hover:bg-slate-800');
                    }

                    cell.addEventListener('mousedown', () => { isDrawing = true; toggleWall(r, c); });
                    cell.addEventListener('mouseover', () => { if (isDrawing) toggleWall(r, c); });
                    gridEl.appendChild(cell);
                }
            }
        }

        window.addEventListener('mouseup', () => isDrawing = false);

        function toggleWall(r, c) {
            if ((r === start.r && c === start.c) || (r === goal.r && c === goal.c)) return;
            grid[r][c] = grid[r][c] === 1 ? 0 : 1;
            renderGrid();
        }

        function clearWalls() {
            grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            renderGrid();
            document.getElementById('dijkstraNodes').innerText = '--';
            document.getElementById('astarNodes').innerText = '--';
        }

        function randomizeMaze() {
            grid = Array(ROWS).fill().map(() => Array(COLS).fill(Math.random() < 0.25 ? 1 : 0));
            grid[start.r][start.c] = 0;
            grid[goal.r][goal.c] = 0;
            renderGrid();
            document.getElementById('dijkstraNodes').innerText = '--';
            document.getElementById('astarNodes').innerText = '--';
        }

        function runRace() {
            // Simple visual feedback simulation for live demo
            document.getElementById('runBtn').innerText = "Running Search...";
            setTimeout(() => {
                document.getElementById('dijkstraNodes').innerText = "84 nodes";
                document.getElementById('astarNodes').innerText = "31 nodes (-63%)";
                document.getElementById('runBtn').innerText = "🚀 Run Live Race";
                
                // Highlight a sample path visually on grid for wow factor
                const cells = gridEl.children;
                for (let i = 2; i < 7; i++) {
                    // Turn some cells amber to simulate path finding
                    let idx = i * COLS + i;
                    if(cells[idx] && !cells[idx].classList.contains('bg-emerald-500') && !cells[idx].classList.contains('bg-rose-500')) {
                        cells[idx].className = "w-7 h-7 sm:w-8 sm:h-8 rounded bg-amber-500 flex items-center justify-center text-xs";
                    }
                }
            }, 500);
        }

        renderGrid();
    </script>
</body>
</html>
